[project]
name = "webhook-replay-cli"
version = "0.1.0"
description = "A CLI tool for archiving and replaying webhook requests with signature verification"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "python-dateutil>=2.8.2",
]

[project.scripts]
webhook-replay = "webhook_replay.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["webhook_replay*"]
