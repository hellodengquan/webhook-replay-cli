[project]
name = "webhook-replay-cli"
version = "0.1.0"
description = "A CLI tool for archiving and replaying webhook requests with signature verification"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
webhook-replay = "webhook_replay.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["webhook_replay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default arg (Typer standard pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
